# fly.toml app configuration file generated for athlead-sse-relay on 2026-09-24T16:32:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'athlead-sse-relay'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 3500
    soft_limit = 2500

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
