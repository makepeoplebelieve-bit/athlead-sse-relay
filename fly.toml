# fly.toml app configuration file generated for athlead-sse-relay on 2026-09-30T08:26:26Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "athlead-sse-relay"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 3

  [http_service.concurrency]
    type = "connections"
    hard_limit = 2000
    soft_limit = 1500

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
